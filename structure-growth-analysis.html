<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Structure Growth / 58 Forms</title>
<style>
:root{font:14px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',Arial,sans-serif;background:#f2f3f4;color:#101112}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.35;cursor:default}.app{height:100dvh;min-height:600px;display:grid;grid-template-columns:288px minmax(0,1fr)}.side{display:flex;flex-direction:column;background:#111;color:#f5f5f5;min-height:0}.head{padding:27px 20px 12px}.kicker{font-size:10px;letter-spacing:.17em;color:#a7a7a7;font-weight:700}.head h1{font-size:22px;margin:8px 0 7px;letter-spacing:-.045em}.head p{color:#aaa;font-size:12px;line-height:1.65;margin:0}.search{margin:12px 14px;color:#fff;background:#272727;border:1px solid #404040;border-radius:9px;padding:11px 12px;outline:none;min-width:0}.filters{display:flex;gap:4px;padding:0 14px 13px}.filters button{background:transparent;border:1px solid #3a3a3a;color:#bbb;padding:7px 9px;border-radius:7px;font-size:11px}.filters button.active{background:#eee;color:#171717}.status{font-size:11px;color:#888;padding:0 18px 7px}.items{overflow:auto;flex:1;padding:0 8px 20px}.item{border:0;text-align:left;background:transparent;color:#ccc;width:100%;padding:11px;border-radius:9px;display:flex;align-items:center;gap:10px}.item:hover{background:#252525}.item.selected{background:#343434;color:white}.num{font:11px ui-monospace,Consolas,monospace;color:#888;min-width:25px}.item strong{font-size:13px;font-weight:600}.item small{font-size:11px;color:#888;display:block;margin-top:4px}.main{min-width:0;display:flex;flex-direction:column}.top{padding:18px 24px 15px;background:#fff;border-bottom:1px solid #e4e4e4;display:flex;align-items:center;justify-content:space-between;gap:10px}.top h2{font-size:22px;margin:0 0 3px}.top p{margin:0;font-size:12px;color:#777}.nav{display:flex;gap:7px}.nav button,.toolbar button{border:1px solid #ddd;border-radius:8px;background:#fff;color:#222;padding:7px 11px}.stage{flex:1;min-height:0;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px}.view{position:relative;min-width:0;min-height:250px;background:#fff;border:1px solid #e2e3e5;border-radius:15px;overflow:hidden}.toolbar{position:absolute;top:13px;left:13px;z-index:3;display:flex;gap:6px}.toolbar button{font-size:12px}.toolbar button.active{background:#1b1b1b;border-color:#1b1b1b;color:white}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}.tip{position:absolute;left:16px;bottom:14px;font-size:11px;color:#999;pointer-events:none;max-width:70%}.info{background:#fff;border:1px solid #e2e3e5;border-radius:15px;padding:21px;overflow:auto}.info h3{margin:0 0 18px;font-size:14px}.data{border-bottom:1px solid #eee;padding:12px 0}.data label{font-size:11px;color:#888;display:block;margin-bottom:4px}.data strong{font-size:16px;font-weight:600}.note{font-size:12px;color:#60666c;line-height:1.8;margin-top:23px}.error{color:#a33;font-size:12px;line-height:1.7;margin-top:13px;white-space:pre-wrap}.foot{padding:10px 20px;color:#868686;font-size:11px;background:#fff;border-top:1px solid #e6e6e6}
@media(max-width:850px){.app{grid-template-columns:188px minmax(0,1fr)}.stage{grid-template-columns:minmax(0,1fr);overflow:auto}.view{height:60vh;min-height:340px}.info{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}.info h3,.note{grid-column:1/-1}.head{padding:16px 12px}.head h1{font-size:18px}.item{padding:8px}.top{padding:13px}}
@media(max-width:530px){.app{height:100dvh;min-height:0;grid-template-columns:116px minmax(0,1fr)}.head{padding:14px 7px}.head h1{font-size:14px}.head p{display:none}.search{padding:8px;margin:8px 5px;width:calc(100% - 10px)}.filters{flex-wrap:wrap;padding:0 5px 9px}.filters button{font-size:9px;padding:5px}.item{gap:3px;padding:7px 4px}.item strong{font-size:10px}.item small{font-size:9px}.num{font-size:9px;min-width:19px}.status{padding-left:7px}.top h2{font-size:15px}.top{padding:8px;flex-wrap:wrap}.nav button{padding:4px 7px}.stage{padding:6px;gap:7px}.view{height:56vh;min-height:260px}.toolbar{top:7px;left:6px;gap:3px}.toolbar button{padding:5px 7px;font-size:10px}.info{padding:12px}.info .data strong{font-size:12px}.foot{padding:6px;font-size:9px}}
</style></head>
<body>
<div class="app">
<aside class="side"><div class="head"><div class="kicker">FORM / ASSEMBLY</div><h1>STRUCTURE GROWTH</h1><p>真实几何 · 58 个拆分结构的独立形态分析</p></div><input id="search" class="search" placeholder="搜索结构编号…"><div id="filters" class="filters"><button data-filter="all" class="active">全部</button><button data-filter="parcel">地块</button><button data-filter="connection">连接</button><button data-filter="edge">边缘</button></div><div class="status" id="count">读取模型中…</div><div class="items" id="items"></div></aside>
<main class="main"><div class="top"><div><h2 id="title">正在读取三维结构…</h2><p id="subtitle">请保持浏览器联网，等待解压公开模型</p></div><div class="nav"><button id="prev" title="上一个结构">←</button><button id="next" title="下一个结构">→</button></div></div><div class="stage"><div class="view"><div class="toolbar"><button data-view="iso" class="active">透视</button><button data-view="top">顶视</button><button data-view="side">侧视</button><button id="reset">重置</button></div><canvas id="viewport"></canvas><div class="tip">拖动：旋转结构 · 滚轮：缩放 · 结构数据来自内置 Rhino 网格</div></div><section class="info"><h3>几何特征 / Growth Hypothesis</h3><div class="data"><label>类型</label><strong id="kind">—</strong></div><div class="data"><label>包围盒 X × Y × Z</label><strong id="bbox">—</strong></div><div class="data"><label>高度范围</label><strong id="zrange">—</strong></div><div class="data"><label>三角面</label><strong id="faces">—</strong></div><div class="data"><label>所属地块</label><strong id="plots">—</strong></div><div class="data"><label>可能的形态生成逻辑</label><strong id="hypothesis" style="font-size:13px;line-height:1.6">—</strong></div><div class="note">注意：以下规则由几何外形推断，不代表已验证原始 Grasshopper 算法。拆分边界不一定是生长起点。</div><div id="error" class="error"></div></section></div><div class="foot">独立分析页面 · 不修改原始 Rhino 模型和主场地网页 · 基于原网站内嵌 58 组基线数据</div></main>
</div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let units=[],picked=0,filter='all',search='',rot=.68,elev=.63,zoom=1,view='iso',drag=false,px=0,py=0,ctx=null,gl=null,prg=null,buf=null,inds=null,current=null,source='';
const cvs=$('#viewport'),items=$('#items');
function kindOf(k){return k==='parcel'?'地块结构':k==='connection'?'连接结构':'边缘结构'}
function f(n){return Number.isFinite(+n)?(+n).toFixed(1):'—'}
function geometry(u){const v=u.mesh.v,t=u.mesh.t;let lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];for(let i=0;i<v.length;i+=3)for(let j=0;j<3;j++){let n=v[i+j];if(n<lo[j])lo[j]=n;if(n>hi[j])hi[j]=n}let size=lo.map((n,j)=>hi[j]-n);return {lo,hi,size,center:lo.map((n,j)=>(n+hi[j])/2),faces:t.length/3}}
function hypothesis(u,g){const a=[g.size[0],g.size[1]].sort((x,y)=>y-x),ratio=a[0]/Math.max(1,a[1]);if(g.size[0]<1&&g.size[1]<1)return'极小切分残片；需与相邻单元合并后判断';if(u.kind==='connection')return ratio>3?'长距离定向延伸／跨地块桥接（待验证）':'多路径连接或局部交汇过渡（待验证）';if(u.kind==='edge')return'边界延伸与局部收束（待验证）';if(ratio>3)return'线性主路径延伸，局部可能产生弯曲和渐缩';if(ratio<1.4)return'面状扩张、分叉或多路径交汇，需进一步提取中心骨架';return'弯曲延伸与节点扩张的复合形态（待验证）'}
function list(){let a=units.filter(u=>(filter==='all'||u.kind===filter)&&(!search||u.id.toLowerCase().includes(search)));$('#count').textContent=a.length+' / '+units.length+' 组';items.innerHTML='';a.forEach(u=>{let i=units.indexOf(u),b=document.createElement('button');b.className='item'+(i===picked?' selected':'');b.innerHTML='<span class="num">'+String(i+1).padStart(2,'0')+'</span><span><strong>'+u.id+'</strong><small>'+kindOf(u.kind)+'</small></span>';b.onclick=()=>select(i);items.appendChild(b)});}
function select(n){if(!units.length)return;picked=(n+units.length)%units.length;const u=units[picked],g=u._g||geometry(u);u._g=g;$('#title').textContent=u.id;$('#subtitle').textContent=kindOf(u.kind)+' · 结构组 '+(picked+1)+' / '+units.length;$('#kind').textContent=kindOf(u.kind);$('#bbox').textContent=g.size.map(f).join(' × ')+' m';$('#zrange').textContent=f(g.lo[2])+' – '+f(g.hi[2])+' m';$('#faces').textContent=g.faces.toLocaleString();$('#plots').textContent=u.kind==='parcel'?'P-'+String((u.parcel??0)+1).padStart(2,'0'):(u.adjacent||[]).map(x=>'P-'+String(x+1).padStart(2,'0')).join(' / ')||'—';$('#hypothesis').textContent=hypothesis(u,g);resetCamera(false);updateMesh(u);list();}
function resetCamera(redraw=true){rot=.68;elev=.63;zoom=1;if(view==='top'){rot=0;elev=Math.PI/2}if(view==='side'){rot=0;elev=0}if(redraw)draw()}
function sourceData(text){let m=text.match(/\bMODEL_GZIP\s*=\s*['"]([A-Za-z0-9+/=]+)['"]/);if(!m)throw Error('当前发布的 index.html 中未找到内置结构数据。');return m[1]}
async function init(){try{let r=await fetch('./index.html?growth_source=1',{cache:'no-store'});if(!r.ok)throw Error('无法读取主网站（HTTP '+r.status+'）');let html=await r.text(),base=sourceData(html);$('#subtitle').textContent='正在解压 Rhino 结构网格…';let bin=Uint8Array.from(atob(base),c=>c.charCodeAt(0));let stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));let data=JSON.parse(await new Response(stream).text());units=(data.units||[]).filter(u=>u.mesh&&u.mesh.v&&u.mesh.t&&u.mesh.t.length);if(!units.length)throw Error('模型数据中未找到可绘制的独立结构网格。');units.sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));glInit();select(0);}catch(e){$('#title').textContent='模型暂时无法读取';$('#subtitle').textContent='在线结构预览读取失败';$('#count').textContent='暂无可用结构';$('#error').textContent=String(e.message||e)+'\n建议刷新网页；如仍失败，请检查网站是否已发布内置 58 组数据。';console.error(e)}}
function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error('3D Shader: '+gl.getShaderInfoLog(s));return s}
function glInit(){try{gl=cvs.getContext('webgl2',{antialias:true,alpha:false,preserveDrawingBuffer:false});if(!gl)throw Error('WebGL2 不可用');let vs=shader(gl.VERTEX_SHADER,'#version 300 es\nprecision highp float;in vec3 aPos;in vec3 aNorm;uniform vec3 uCenter;uniform float uYaw,uElev,uScale,uAspect;out float vShade;void main(){vec3 p=aPos-uCenter;float cx=cos(uYaw),sx=sin(uYaw),ce=cos(uElev),se=sin(uElev);float xx=cx*p.x-sx*p.y,yy=sx*p.x+cx*p.y;float up=ce*p.z-se*yy,depth=ce*yy+se*p.z;gl_Position=vec4(xx*uScale/uAspect,up*uScale,depth*uScale*.22,1.0);float lit=abs(dot(normalize(aNorm),normalize(vec3(-.45,.35,.87))));vShade=.64+.36*lit;}');let fs=shader(gl.FRAGMENT_SHADER,'#version 300 es\nprecision highp float;in float vShade;out vec4 color;void main(){color=vec4(vec3(.69,.74,.79)*vShade,1.0);}');prg=gl.createProgram();gl.attachShader(prg,vs);gl.attachShader(prg,fs);gl.linkProgram(prg);if(!gl.getProgramParameter(prg,gl.LINK_STATUS))throw Error('WebGL program: '+gl.getProgramInfoLog(prg));gl.useProgram(prg);gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);gl.clearColor(.96,.965,.97,1);gl.uniform1i(gl.getUniformLocation(prg,'none'),0);buf=gl.createBuffer();inds=gl.createBuffer();}catch(e){gl=null;$('#error').textContent='设备不支持 WebGL2，已启用二维画布预览。'+(e.message||'');ctx=cvs.getContext('2d')}}
function updateMesh(u){current=u;if(!gl){draw();return}const v=u.mesh.v,t=u.mesh.t;let normals=new Float32Array(v.length);for(let i=0;i<t.length;i+=3){let ia=t[i]*3,ib=t[i+1]*3,ic=t[i+2]*3;let ax=v[ib]-v[ia],ay=v[ib+1]-v[ia+1],az=v[ib+2]-v[ia+2],bx=v[ic]-v[ia],by=v[ic+1]-v[ia+1],bz=v[ic+2]-v[ia+2],nx=ay*bz-az*by,ny=az*bx-ax*bz,nz=ax*by-ay*bx;for(let j of [ia,ib,ic]){normals[j]+=nx;normals[j+1]+=ny;normals[j+2]+=nz}}let packed=new Float32Array(v.length*2);for(let i=0;i<v.length;i+=3){let q=2*i;packed.set([v[i],v[i+1],v[i+2]],q);let l=Math.hypot(normals[i],normals[i+1],normals[i+2])||1;packed.set([normals[i]/l,normals[i+1]/l,normals[i+2]/l],q+3)}gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,packed,gl.STATIC_DRAW);for(let k of [['aPos',0],['aNorm',12]]){let loc=gl.getAttribLocation(prg,k[0]);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,3,gl.FLOAT,false,24,k[1])}gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,inds);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(t),gl.STATIC_DRAW);draw()}
function draw(){if(!current)return;const w=cvs.clientWidth,h=cvs.clientHeight;if(!w||!h)return;let dpr=Math.min(window.devicePixelRatio||1,2),ww=Math.max(1,Math.round(w*dpr)),hh=Math.max(1,Math.round(h*dpr));if(cvs.width!==ww||cvs.height!==hh){cvs.width=ww;cvs.height=hh}let g=current._g,span=Math.max(...g.size,1),scale=1/(span*.64)*zoom;if(gl){gl.viewport(0,0,ww,hh);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(prg);gl.uniform3fv(gl.getUniformLocation(prg,'uCenter'),g.center);gl.uniform1f(gl.getUniformLocation(prg,'uYaw'),rot);gl.uniform1f(gl.getUniformLocation(prg,'uElev'),elev);gl.uniform1f(gl.getUniformLocation(prg,'uScale'),scale);gl.uniform1f(gl.getUniformLocation(prg,'uAspect'),w/h);gl.drawElements(gl.TRIANGLES,current.mesh.t.length,gl.UNSIGNED_INT,0);return}let cc=ctx||cvs.getContext('2d');cc.clearRect(0,0,ww,hh);cc.fillStyle='#f5f6f7';cc.fillRect(0,0,ww,hh);cc.scale(dpr,dpr);let V=current.mesh.v,T=current.mesh.t,verts=[],c=Math.cos(rot),s=Math.sin(rot),ce=Math.cos(elev),se=Math.sin(elev);for(let i=0;i<V.length;i+=3){let x=V[i]-g.center[0],y=V[i+1]-g.center[1],z=V[i+2]-g.center[2],xx=c*x-s*y,yy=s*x+c*y;verts.push([w/2+xx*scale*h/2,h/2-(ce*z-se*yy)*scale*h/2,ce*yy+se*z])}let tris=[];const step=Math.max(1,Math.ceil(T.length/3/4500));for(let i=0;i<T.length;i+=3*step){let a=verts[T[i]],b=verts[T[i+1]],c2=verts[T[i+2]];tris.push([a,b,c2,(a[2]+b[2]+c2[2])/3])}tris.sort((a,b)=>b[3]-a[3]);for(let t of tris){cc.beginPath();cc.moveTo(t[0][0],t[0][1]);cc.lineTo(t[1][0],t[1][1]);cc.lineTo(t[2][0],t[2][1]);cc.closePath();cc.fillStyle='#aab6bf';cc.fill()}cc.setTransform(1,0,0,1,0,0)}
let observer=new ResizeObserver(draw);observer.observe(cvs);$('#filters').onclick=e=>{if(!e.target.dataset.filter)return;filter=e.target.dataset.filter;$$('#filters button').forEach(b=>b.classList.toggle('active',b===e.target));list()};$('#search').oninput=e=>{search=e.target.value.trim().toLowerCase();list()};$('#prev').onclick=()=>select(picked-1);$('#next').onclick=()=>select(picked+1);$$('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;$$('[data-view]').forEach(x=>x.classList.toggle('active',x===b));resetCamera();draw()});$('#reset').onclick=()=>resetCamera();cvs.onpointerdown=e=>{drag=true;px=e.clientX;py=e.clientY;cvs.setPointerCapture(e.pointerId);cvs.style.cursor='grabbing'};cvs.onpointerup=()=>{drag=false;cvs.style.cursor='grab'};cvs.onpointermove=e=>{if(!drag)return;rot+=(e.clientX-px)*.008;elev=Math.max(-1.55,Math.min(1.57,elev+(e.clientY-py)*.008));px=e.clientX;py=e.clientY;draw()};cvs.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.25,Math.min(8,zoom*(e.deltaY>0?.9:1.1)));draw()},{passive:false});init();
</script></body></html>
