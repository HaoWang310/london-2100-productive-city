name: Verify Rhino 3DM source import
on:
  push:
    paths:
      - index.html
      - latest-model-loader.js
      - 2.3dm
      - tests/verify-rhino-model-import.cjs
      - .github/workflows/verify-rhino-model-import.yml
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/verify-rhino-model-import.cjs
