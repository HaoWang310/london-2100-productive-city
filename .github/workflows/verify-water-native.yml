name: Verify geometry-first Rhino water
on:
  push:
    paths:
      - index.html
      - .github/workflows/verify-water-native.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert native footprint, connectedness and road clearance
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),zlib=require('zlib'),vm=require('vm'),assert=require('assert');
          const html=fs.readFileSync('index.html','utf8');
          const compressed=html.match(/const MODEL_GZIP='([^']+)'/);
          assert(compressed,'Original Rhino mesh must exist');
          const model=JSON.parse(zlib.gunzipSync(Buffer.from(compressed[1],'base64')));
          const between=(a,b)=>{
            const i=html.indexOf(a),j=html.indexOf(b,i+a.length);
            assert(i>=0&&j>i,'Source markers must exist: '+a);
            return html.slice(i,j);
          };
          const native=between('function nativeRecessedChannel(){','function pointInTriangle2D');
          const polygon=between('function pointInPolygon(pt,b)','function distanceToSegment');
          const source="const WATER_RECESS_SOURCE_LEVEL=-1;let nativeChannelCache=null;\n"+polygon+"\n"+native+"\nthis.waterResult=nativeRecessedChannel()";
          const context={model,console};
          vm.runInNewContext(source,context,{timeout:10000});
          const r=context.waterResult;
          const minRoad=Math.min(...model.roads.v.filter((_,i)=>i%3===2));
          const maxRoad=Math.max(...model.roads.v.filter((_,i)=>i%3===2));
          assert.equal(model.parcels.length,24,'Parcel topology changed');
          assert.equal(r.connectedChannelFaces,139,'Main -1 m channel disconnected or detached channel leaked');
          assert(r.basinFaces>800,'The true -2 to -5 m P-24 terraces are missing');
          assert(r.triangles.length>850,'Missing native triangles');
          assert(r.area>10000,'Water is incomplete');
          assert(r.waterline<=minRoad-.6,'Water would overlap the road elevation');
          const p24=model.parcels.find(p=>p.id==='P-24');
          function within(pt,poly){let hit=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const [xi,yi]=poly[i],[xj,yj]=poly[j];if((yi>pt[1])!==(yj>pt[1])&&pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi+1e-12)+xi)hit=!hit}return hit}
          const outside=r.triangles.filter(tri=>!within(tri.reduce((p,q)=>[p[0]+q[0]/3,p[1]+q[1]/3],[0,0]),p24.boundary));
          assert(outside.length>20,'Connected channels at P-22 / P-23 missing');
          const end=html.lastIndexOf('</script>'),begin=html.indexOf("</script><script>'use strict';")+("<\/script><script>").length;
          new Function(html.slice(begin,end));
          console.log('PASS: Rhino geometry and final app JS syntax');
          console.log(JSON.stringify({waterline:r.waterline,roadMin:minRoad,roadMax:maxRoad,connectedMinusOne:r.connectedChannelFaces,submergedBasinFaces:r.basinFaces,sourceFaces:r.sourceFaces,waterTriangles:r.triangles.length,waterArea:r.area,grooveTrianglesOutsideP24:outside.length,parcels:model.parcels.length,units:model.units.length},null,2));
          NODE