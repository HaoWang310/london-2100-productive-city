name: Detailed water source terrace audit
on:
  push:
    paths:
      - '.github/workflows/water-source-report.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect actual Rhino site and road elevations (read-only)
        run: |
          python3 - <<'PY'
          import re,base64,gzip,json,collections,math
          source=open('index.html',encoding='utf-8').read()
          m=re.search(r"const MODEL_GZIP='([^']+)'",source)
          assert m,'Embedded Rhino geometry missing'
          data=json.loads(gzip.decompress(base64.b64decode(m.group(1))))
          print('DATA KEYS:',list(data.keys()))
          for key in ['site','roads']:
            mesh=data.get(key,{})
            print('MESH',key,'keys:',list(mesh.keys()))
            v=mesh.get('v',[]); t=mesh.get('t',[])
            print('MESH',key,'vertexCount=',len(v)//3,'faceCount=',len(t)//3)
            print('HEIGHT',key,'levels:',collections.Counter(round(v[i+2],2) for i in range(0,len(v),3)).most_common(18))
            print('HEIGHT',key,'minmax:',(min(v[2::3]),max(v[2::3])) if v else None)
          ps=data.get('parcels',[])
          print('PARCELS',len(ps))
          for p in ps:
            if p.get('id') in ['P-22','P-23','P-24']:
              bb=p.get('boundary',[])
              print('PARCEL',p['id'],'bounds',([min(x for x,y in bb),min(y for x,y in bb),max(x for x,y in bb),max(y for x,y in bb)] if bb else None),'vertices',len(bb))
          mesh=data['site'];v=mesh['v'];tt=mesh['t']
          eligible={}
          edge_map=collections.defaultdict(list)
          for i in range(0,len(tt),3):
            pts=[(v[3*tt[i+j]],v[3*tt[i+j]+1],v[3*tt[i+j]+2]) for j in range(3)]
            if any(abs(p[2]+1)>.015 for p in pts): continue
            a,b,c=pts
            area=abs((b[0]-a[0])*(c[1]-a[1])-(c[0]-a[0])*(b[1]-a[1]))/2
            if area<.04:continue
            eligible[i]=(pts,area)
            for j in range(3):
              a,b=pts[j],pts[(j+1)%3]
              edge=tuple(sorted((tuple(round(q,2) for q in a[:2]),tuple(round(q,2) for q in b[:2]))))
              edge_map[edge].append(i)
          visited=set()
          components=[]
          for idx in eligible:
            if idx in visited:continue
            todo=[idx];faces=[];total=0
            while todo:
              k=todo.pop()
              if k in visited: continue
              visited.add(k);pts,area=eligible[k];faces.append(k);total+=area
              for j in range(3):
                a,b=pts[j],pts[(j+1)%3]
                edge=tuple(sorted((tuple(round(q,2) for q in a[:2]),tuple(round(q,2) for q in b[:2]))))
                todo.extend(edge_map[edge])
            xs=[p[0] for k in faces for p in eligible[k][0]]
            ys=[p[1] for k in faces for p in eligible[k][0]]
            components.append({'faces':len(faces),'area':round(total,1),'bounds':list(map(lambda z:round(z,2),[min(xs),min(ys),max(xs),max(ys)]))})
          components.sort(key=lambda c:-c['area'])
          print('RECESS -1 TRIANGLES:',len(eligible),'COMPONENT COUNT:',len(components))
          for comp in components[:35]:print('RECESS COMPONENT',comp)

          # Inspect native mesh horizontal surfaces within parcels; preserve model source.
          def inside(pt,b):
            x,y=pt; hit=False
            for a,c in zip(b,b[1:]+b[:1]):
              if ((a[1]>y)!=(c[1]>y)) and x < (c[0]-a[0])*(y-a[1])/(c[1]-a[1])+a[0]:hit=not hit
            return hit
          hist=collections.defaultdict(lambda:collections.defaultdict(lambda:[0,0.]))
          bounds=collections.defaultdict(list)
          for k in range(0,len(tt),3):
            pts=[(v[3*tt[k+j]],v[3*tt[k+j]+1],v[3*tt[k+j]+2]) for j in range(3)]
            zs=[p[2] for p in pts]
            if max(zs)-min(zs)>.015:continue
            z=round(sum(zs)/3,2)
            if not (-6<=z<=0):continue
            a,b,c=pts;area=abs((b[0]-a[0])*(c[1]-a[1])-(c[0]-a[0])*(b[1]-a[1]))/2
            center=(sum(p[0] for p in pts)/3,sum(p[1] for p in pts)/3)
            parcel=next((p['id'] for p in ps if inside(center,p['boundary'])),'OUT')
            hist[parcel][z][0]+=1;hist[parcel][z][1]+=area
            if z in [-5,-4,-3,-2,-1,0] and parcel in ['P-22','P-23','P-24']:bounds[(parcel,z)].append(center)
          for parcel in ['P-22','P-23','P-24','OUT']:
            print('LEVEL ANALYSIS',parcel,{z:(n,round(area,1)) for z,(n,area) in sorted(hist[parcel].items())})
          for (parcel,z),xy in sorted(bounds.items()):
            print('LEVEL BOUNDS',parcel,z,len(xy),tuple(round(a,1) for a in [min(p[0] for p in xy),min(p[1] for p in xy),max(p[0] for p in xy),max(p[1] for p in xy)]))
          PY